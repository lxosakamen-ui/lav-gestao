function transferSuggested(pid,loc,qty){

 const raw=prompt('Transferir '+p.name+' do Armazém para '+loc+'\nNecessário: '+qty+' · Disponível: '+available+'\nQuantidade a transferir:',String(proposed));
 if(raw===null)return;
 const n=Number(raw.replace(',','.'));
 if(!Number.isFinite(n)||n<=0||n>available)return alert('Quantidade inválida ou superior ao stock disponível no armazém.');
 if(!confirm('Confirmar transferência de '+n+' '+(p.unit||'un.')+' de '+p.name+' para '+loc+'?'))return;
 const group=uid(),base={date:today(),productId:pid,unitCost:p.cost,unitPrice:p.price,eventId:null,notes:'Reposição sugerida por stock mínimo'};

}

urchase',date:today(),productId:i.productId,location:'Armazém',delta:i.qty,unitCost:i.cost,unitPrice:product(i.productId)?.price||0,notes:'Receção da requisição '+id,eventId:null});r.received=true;persist();render();notify('Receção registada no armazém')}
function closePage(){const es=[...db.events].sort((a,b)=>b.date.localeCompare(a.date));return heading('Fecho de evento','Vendas, consumo e resultados por bar e por evento',`<button class="btn primary" onclick="openClose()">＋ Registar fecho</button>`)+panel('Resumo por evento',table(['Evento','Data','Bares com vendas','Vendas','Custo produtos','Margem bruta','Staff'],es.map(x=>{const ms=eventSales(x.id),rev=ms.reduce((s,m)=>s+saleValue(m),0),cost=ms.reduce((s,m)=>s+costValue(m),0),used=new Set(ms.map(m=>m.location));return `<tr><td><strong>${e(x.name)}</strong></td><td>${date(x.date)}</td><td>${used.size}</td><td>${money(rev)}</td><td>${money(cost)}</td><td><strong>${money(rev-cost)}</strong></td><td>${money(staffCost(x.id))}</td></tr>`}).join('')))+panel('Notas de fecho',table(['Evento','Bares','Observações','Data'],[...db.closings].reverse().map(c=>`<tr><td>${e(event(c.eventId)?.name||'—')}</td><td>${e(c.bars.join(', '))}</td><td>${e(c.notes)}</td><td>${date(c.date)}</td></tr>`).join('')))+`<div class="notice blue">Margem bruta = vendas menos custo dos produtos. O custo de staff é apresentado à parte; não inclui rendas, impostos nem outras despesas. Não são efetuados descontos de stock no fecho.</div>`}function openClose(){if(!db.events.length)return alert('Cria um evento primeiro.');formModal('Fecho de evento',`<div class="formgrid">${select('Evento','fEvent',db.events.map(x=>({id:x.id,name:x.name+' · '+date(x.date)})),'','onchange="updateCloseBars()"')}${field('Data do fecho','fDate','date',today())}</div><h3 style="margin-top:20px">Bares que trabalharam</h3><div id="closeBars" class="check-list"></div><label class="field" style="margin-top:16px">Notas e ocorrências<textarea id="fNotes" placeholder="Resumo operacional, diferenças, observações..."></textarea></label>`,()=>{const bars=[...document.querySelectorAll('[data-close-bar]:checked')].map(x=>x.value);if(!bars.length)throw Error('Seleciona pelo menos um bar');db.closings.push({id:uid(),eventId:v('fEvent'),da let estEvent='',estBar='',estDraft={};
function estIsSpirit(p){return /gin|vodka|whisk|rum|tequila|licor|aguardente|cognac|brandy|espirituosa/i.test((p.category||'')+' '+p.name)}
function estYield(p){return estIsSpirit(p)?12:1}
function estMoney(q,p){return {cost:q*num(p.cost),revenue:q*estYield(p)*num(p.price)}}
function estOptions(items,selected){return items.map(x=>`<option value="${e(x.id)}" ${String(x.id)===String(selected)?'selected':''}>${e(x.name)}</option>`).join('')}
function estMovementQty(pid,loc,eid){return db.movements.filter(m=>m.type==='transfer'&&m.productId===pid&&m.location===loc&&String(m.eventId||'')===String(eid)).reduce((n,m)=>n+num(m.delta),0)}
function estStored(eid,bar){return [...db.estimates].reverse().find(x=>x.eventId===eid&&x.bar===bar)}
function estimatePage(){const es=[...db.events].sort((a,b)=>b.date.localeCompare(a.date)),bs=locations().filter(x=>x!=='Armazém');if(!estEvent||!es.some(x=>x.id===estEvent))estEvent=es[0]?.id||'';if(!estBar||!bs.includes(estBar))estBar=bs[0]||'';const temp=/golden|heineken/i.test(estBar);const saved=estStored(estEvent,estBar);const chosen=db.products.filter(p=>num(estDraft[p.id]?.qty)>0);const summary=chosen.reduce((a,p)=>{const x=estMoney(num(estDraft[p.id].qty),p);a.cost+=x.cost;a.revenue+=x.revenue;return a},{cost:0,revenue:0});const rows=db.products.map(p=>{const d=estDraft[p.id]||{},q=num(d.qty),m=estMoney(q,p);return `<tr><td><strong>${e(p.name)}</strong><div class="muted mini">${e(p.category)} · ${estIsSpirit(p)?'12 doses/garrafa':'por unidade'}</div></td><td>${temp?`<span class="pill">${Math.max(0,estMovementQty(p.id,estBar,estEvent)).toLocaleString('pt-PT',{maximumFractionDigits:2})}</span>`:`<input type="number" min="0" step="0.1" class="est-input" data-est-initial="${e(p.id)}" value="${d.initial??''}" placeholder="Inicial">`}</td><td><input type="number" min="0" step="0.1" class="est-input" data-est-final="${e(p.id)}" value="${d.final??''}" placeholder="${temp?'Devolução':'Final'}"></td><td><strong>${q.toLocaleString('pt-PT',{maximumFractionDigits:2})}</strong></td><td>${money(m.cost)}</td><td><strong>${money(m.revenue)}</strong></td></tr>`}).join('');return heading('Consumo estimado','Contagem rápida por evento e bar, com custo e receita aproximados')+`<div class="notice blue"><strong>Espirituosas:</strong> 1,0 garrafa = 12 doses estimadas; 0,1 = 1,2 doses. As restantes bebidas são valorizadas por unidade. As estimativas não são vendas reais nem descontam stock automaticamente.</div>`+panel('Selecionar evento e bar',`<div class="panel-body formgrid"><label class="field">Evento<select id="estEvent" onchange="estSwitch()">${estOptions(es,estEvent)}</select></label><label class="field">Bar<select id="estBar" onchange="estSwitch()">${bs.map(x=>`<option ${x===estBar?'selected':''}>${e(x)}</option>`).join('')}</select></label></div>`)+panel(temp?'Saídas e devoluções · '+e(estBar):'Contagem inicial e final · '+e(estBar),`<div class="notice blue">${temp?'A coluna Saída lê as transferências associadas a este evento. Regista primeiro a transferência do armazém para este bar em Compras & vendas. Introduz aqui as quantidades devolvidas (incluindo garrafas abertas).':'Introduz a quantidade inicial e a quantidade que ficou no bar. Os reforços devem ser incluídos na quantidade inicial total. Não altera o inventário.'}</div><div class="toolbar"><input id="estSearch" placeholder="Pesquisar produto ou categoria" oninput="estFilter()" style="width:100%;max-width:400px"></div><div class="table-wrap"><table class="est-table"><thead><tr><th>Produto</th><th>${temp?'Saída':'Inicial + reforços'}</th><th>${temp?'Devolução':'Final'}</th><th>Consumo</th><th>Custo</th><th>Venda estimada</th></tr></thead><tbody id="estRows">${rows}</tbody></table></div><div class="panel-body"><div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="metric"><div class="mt">Custo estimado</div><div class="mv" id="estCost">${money(summary.cost)}</div></div><div class="metric"><div class="mt">Venda estimada</div><div class="mv" id="estRevenue">${money(summary.revenue)}</div></div><div class="metric"><div class="mt">Margem estimada</div><div class="mv" id="estMargin">${money(summary.revenue-summary.cost)}</div></div></div><div class="actions"><button class="btn primary" onclick="saveEstimate()">Guardar estimativa ${temp?'e devolver ao armazém':''}</button><button class="btn" onclick="estDraft={};render()">Limpar campos</button></div>${saved?`<p class="muted mini">Já existe uma estimativa guardada para este evento/bar. Para evitar devoluções duplicadas, não é permitido guardar outra para o mesmo par.</p>`:''}</div>`)+panel('Histórico de estimativas',table(['Evento','Bar','Consumo valorizado','Custo','Receita estimada','Margem'],[...db.estimates].reverse().map(x=>`<tr><td>${e(event(x.eventId)?.name||'—')}</td><td>${e(x.bar)}</td><td>${x.items.length} produtos</td><td>${money(x.cost)}</td><td>${money(x.revenue)}</td><td><strong>${money(x.revenue-x.cost)}</strong></td></tr>`).join('')))}
function estFilter(){const q=(v('estSearch')||'').toLowerCase();document.querySelectorAll('#estRows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function estSwitch(){estEvent=v('estEvent');estBar=v('estBar');estDraft={};render()}
function estUpdate(){const temp=/golden|heineken/i.test(estBar);const inputs=document.querySelectorAll('[data-est-initial],[data-est-final]');inputs.forEach(x=>{const id=x.dataset.estInitial||x.dataset.estFinal;if(!estDraft[id])estDraft[id]={};estDraft[id][x.dataset.estInitial?'initial':'final']=x.value});for(const p of db.products){const d=estDraft[p.id]||{},initial=temp?Math.max(0,estMovementQty(p.id,estBar,estEvent)):Number(d.initial)||0,final=Number(d.final)||0;d.qty=Math.max(0,initial-final);estDraft[p.id]=d}let cost=0,revenue=0;db.products.forEach(p=>{const q=estDraft[p.id].qty,m=estMoney(q,p);cost+=m.cost;revenue+=m.revenue;const input=document.querySelector(`[data-est-final="${CSS.escape(p.id)}"]`);if(input){const row=input.closest('tr');row.children[3].textContent=q.toLocaleString('pt-PT',{maximumFractionDigits:2});row.children[4].textContent=money(m.cost);row.children[5].textContent=money(m.revenue)}});$('estCost').textContent=money(cost);$('estRevenue').textContent=money(revenue);$('estMargin').textContent=money(revenue-cost)}
function saveEstimate(){try{if(!estEvent)throw Error('Cria um evento primeiro');if(estStored(estEvent,estBar))throw Error('Já existe um fecho de consumo para este evento e bar. Não é possível duplicar as devoluções.');estUpdate();const temp=/golden|heineken/i.test(estBar),items=[];for(const p of db.products){const d=estDraft[p.id]||{},hasFinal=d.final!==undefined&&String(d.final).trim()!=='';if(!hasFinal)continue;const initial=temp?Math.max(0,estMovementQty(p.id,estBar,estEvent)):Number(d.initial),final=Number(d.final);if(!Number.isFinite(initial)||!Number.isFinite(final)||initial<0||final<0||final>initial+0.00001)throw Error('Contagem inválida para '+p.name);if(!temp&&(d.initial===undefined||String(d.initial).trim()===''))throw Error('Preenche a contagem inicial de '+p.name);const qty=Math.round((initial-final)*1000)/1000;if(qty>0||temp&&initial>0)items.push({productId:p.id,initial,final,qty,unitCost:num(p.cost),unitPrice:num(p.price),yield:estYield(p)})}if(!items.length)throw Error('Preenche pelo menos um produto com consumo ou devolução');const cost=items.reduce((a,x)=>a+x.qty*x.unitCost,0),revenue=items.reduce((a,x)=>a+x.qty*x.yield*x.unitPrice,0);if(!confirm('Guardar estimativa de '+event(estEvent).name+' / '+estBar+'?'+(temp?' As devoluções indicadas serão transferidas de volta para o armazém.':'')))return;if(temp){for(const x of items){if(x.final>balance(x.productId,estBar)+0.00001)throw Error('Stock insuficiente para devolver '+(product(x.productId)?.name||''));}for(const x of items){if(x.final<=0)continue;const group=uid(),base={date:today(),productId:x.productId,unitCost:x.unitCost,unitPrice:x.unitPrice,eventId:estEvent,notes:'Devolução automática do fecho '+estBar,group};db.movements.push({id:uid(),type:'transfer',location:estBar,delta:-x.final,...base},{id:uid(),type:'transfer',location:'Armazém',delta:x.final,...base})}}db.estimates.push({id:uid(),date:today(),eventId:estEvent,bar:estBar,mode:temp?'return':'fixed',items,cost,revenue});persist();estDraft={};render();notify('Estimativa guardada')}catch(err){alert(err.message)}}
document.addEventListener('input',ev=>{if(ev.target.matches('[data-est-initial],[data-est-final]'))estUpdate()});
// CONTROLO SEMANAL: fotografias de stock por segunda-feira. Nunca atribui consumo a um evento individual.
let weekDate='',weekLoc='Sala 1 · Bar 1',weekSearch='',weekCategory='';
function weekMonday(x){const d=new Date(x+'T12:00:00');if(Number.isNaN(d.getTime()))return '';const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function weekAdd(x,n){const d=new Date(x+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function weekSaved(d,loc){return db.weeklyCounts.find(x=>x.date===d&&x.location===loc)}
function weekDraftKey(){return weekDate+'|'+weekLoc}
function weekDraft(){return db.weeklyDrafts[weekDraftKey()]||{}}
function weekIsSpirit(p){return estIsSpirit(p)}
function weekStep(p){return weekIsSpirit(p)?'0.1':'1'}
function weekPrevious(d,loc){return [...db.weeklyCounts].filter(x=>x.location===loc&&x.date<d).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function weekSupply(pid,loc,start,end){return db.movements.filter(m=>m.productId===pid&&m.location===loc&&m.date>=start&&m.date<end&&m.type!=='sale'&&m.weeklyClose!==true).reduce((a,m)=>a+num(m.delta),0)}
function weekReadInputs(){document.querySelectorAll('[data-week-pid]').forEach(el=>{const key=weekDraftKey();db.weeklyDrafts[key]=db.weeklyDrafts[key]||{};db.weeklyDrafts[key][el.dataset.weekPid]=el.value});persist()}
function weekSwitch(){weekReadInputs();weekDate=$('weekDate').value;weekLoc=$('weekLoc').value;weekSearch=$('weekSearch')?.value||'';weekCategory=$('weekCat')?.value||'';render()}
function weekFilter(){weekReadInputs();weekSearch=$('weekSearch').value;weekCategory=$('weekCat').value;weekDrawRows()}
function weekDrawRows(){const el=$('weekRows');if(!el)return;const existing=weekSaved(weekDate,weekLoc),prev=weekPrevious(weekDate,weekLoc),draft=weekDraft();let list=db.products.filter(p=>(!weekSearch||p.name.toLocaleLowerCase('pt-PT').includes(weekSearch.toLocaleLowerCase('pt-PT')))&&(!weekCategory||p.category===weekCategory));list.sort((a,b)=>{const ai=db.categories.indexOf(a.category),bi=db.categories.indexOf(b.category);return (ai<0?999:ai)-(bi<0?999:bi)||a.name.localeCompare(b.name,'pt-PT',{sensitivity:'base',numeric:true})});el.innerHTML=list.map(p=>{const qty=existing?.items?.find(x=>x.productId===p.id)?.qty;const val=qty??draft[p.id]??'';const old=prev?.items?.find(x=>x.productId===p.id)?.qty;return `<tr><td><strong>${e(p.name)}</strong><div class="muted mini">${e(p.category)} · ${weekIsSpirit(p)?'garrafas (0,1)':'unidades'}</div></td><td>${old===undefined?'—':Number(old).toLocaleString('pt-PT',{maximumFractionDigits:2})}</td><td><input aria-label="Contagem ${e(p.name)}" data-week-pid="${e(p.id)}" type="number" min="0" step="${weekStep(p)}" ${existing?'disabled':''} value="${e(val)}" placeholder="Contar" style="width:110px"></td></tr>`}).join('')||'<tr><td colspan="3">Sem produtos encontrados.</td></tr>'}
function weekCountSummary(count,prev){if(!prev)return null;const result={cost:0,revenue:0,items:[]};for(const p of db.products){const a=prev.items.find(x=>x.productId===p.id),b=count.items.find(x=>x.productId===p.id);if(!a||!b)continue;const supplied=weekSupply(p.id,count.location,prev.date,count.date);const consumed=Math.round((num(a.qty)+supplied-num(b.qty))*1000)/1000;const cost=consumed*num(p.cost),revenue=consumed*estYield(p)*num(p.price);result.items.push({productId:p.id,name:p.name,consumed,cost,revenue});result.cost+=cost;result.revenue+=revenue}return result}
function weeklyPage(){if(!weekDate)weekDate=weekMonday(today());if(!db.locations.includes(weekLoc)||weekLoc==='Armazém')weekLoc=db.locations.find(x=>x!=='Armazém')||'Armazém';const locs=db.locations.filter(x=>x!=='Armazém');const existing=weekSaved(weekDate,weekLoc),prev=weekPrevious(weekDate,weekLoc);const closes=db.weeklyCounts.filter(x=>x.previousDate).sort((a,b)=>b.date.localeCompare(a.date));let totals={cost:0,revenue:0};for(const c of closes){const previous=weekSaved(c.previousDate,c.location);if(previous){const t=weekCountSummary(c,previous);totals.cost+=t.cost;totals.revenue+=t.revenue}}return heading('Fecho semanal','Contagens às segundas-feiras · resultados por bar e por semana')+`<div class="notice blue"><strong>Regra:</strong> primeira segunda-feira = contagem inicial. Na segunda seguinte, o programa calcula consumo = inicial + reposições − final. Golden + Heineken funciona como uma única prateleira, com stock independente do armazém principal. Espirituosas: 12 doses estimadas por garrafa.</div>`+panel('Selecionar contagem',`<div class="panel-body formgrid"><label class="field">Segunda-feira<input id="weekDate" type="date" value="${e(weekDate)}" onchange="weekSwitch()"></label><label class="field">Local de stock<select id="weekLoc" onchange="weekSwitch()">${opt(locs,weekLoc)}</select></label></div><div class="notice">${existing?'Contagem guardada e bloqueada.':'Contagem ainda não guardada.'} ${prev?'Contagem anterior: '+date(prev.date):'Primeira contagem deste bar: será a base para calcular a semana seguinte.'}</div>`)+panel('Contar produtos',`<div class="panel-body"><div class="toolbar"><input id="weekSearch" value="${e(weekSearch)}" placeholder="Pesquisar produto" oninput="weekFilter()"><select id="weekCat" onchange="weekFilter()"><option value="">Todas as categorias</option>${opt(db.categories,weekCategory)}</select></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Contagem anterior</th><th>Contagem atual</th></tr></thead><tbody id="weekRows"></tbody></table></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="weekReadInputs();notify('Rascunho guardado')" ${existing?'disabled':''}>Guardar rascunho</button><button class="btn primary" onclick="weekSave()" ${existing?'disabled':''}>Confirmar contagem de segunda-feira</button></div><p class="muted mini">Preenche todos os produtos, mesmo os que estão a zero. Não é obrigatório preencher tudo de uma vez: guarda o rascunho e continua depois. A confirmação é definitiva e atualiza o inventário pela diferença da contagem.</p></div>`)+panel('Resumo semanal por bar',table(['Semana terminada','Local','Custo consumido','Venda estimada','Margem'],closes.map(c=>{const prev=weekSaved(c.previousDate,c.location);if(!prev)return '';const r=weekCountSummary(c,prev);return `<tr><td>${date(c.previousDate)} — ${date(c.date)}</td><td>${e(c.location)}</td><td>${money(r.cost)}</td><td>${money(r.revenue)}</td><td><strong>${money(r.revenue-r.cost)}</strong></td></tr>`}).join('')))+panel('Totais dos fechos registados',`<div class="metrics"><div class="metric"><div class="mt">Custo consumido</div><div class="mv">${money(totals.cost)}</div></div><div class="metric"><div class="mt">Venda estimada</div><div class="mv">${money(totals.revenue)}</div></div><div class="metric"><div class="mt">Margem estimada</div><div class="mv">${money(totals.revenue-totals.cost)}</div></div></div><div class="notice">Valores estimados, não faturação efetiva. Estes totais somam os fechos já realizados, não apenas a semana selecionada.</div>`)}
function weekSave(){try{if(weekMonday(weekDate)!==weekDate)throw Error('Seleciona uma segunda-feira.');if(weekSaved(weekDate,weekLoc))throw Error('Esta contagem já está fechada.');weekReadInputs();const prev=weekPrevious(weekDate,weekLoc);if(prev&&weekAdd(prev.date,7)!==weekDate)throw Error('Falta uma contagem semanal intermédia. Faz primeiro a contagem da segunda-feira seguinte a '+prev.date);if(db.weeklyCounts.some(x=>x.location===weekLoc&&x.date>weekDate))throw Error('Não podes inserir uma contagem anterior a uma já fechada.');const draft=weekDraft(),items=[];for(const p of db.products){const raw=draft[p.id];if(raw===undefined||String(raw).trim()==='')throw Error('Falta contar: '+p.name+'. Podes guardar rascunho e continuar depois.');const qty=Number(raw);if(!Number.isFinite(qty)||qty<0)throw Error('Contagem inválida: '+p.name);if(!weekIsSpirit(p)&&Math.abs(qty-Math.round(qty))>0.00001)throw Error('Usa unidades inteiras para '+p.name);if(weekIsSpirit(p)&&Math.abs(qty*10-Math.round(qty*10))>0.00001)throw Error('Usa incrementos de 0,1 para '+p.name);items.push({productId:p.id,qty})}const count={id:uid(),date:weekDate,location:weekLoc,items,previousDate:prev?.date||null,createdAt:new Date().toISOString()};if(prev){const summary=weekCountSummary(count,prev);const neg=summary.items.filter(x=>x.consumed<-.001);if(neg.length)throw Error('Consumo negativo em '+neg.slice(0,3).map(x=>x.name).join(', ')+'. Verifica as reposições e contagens.');}if(!confirm('Confirmar a contagem de '+weekLoc+' em '+date(weekDate)+'? Esta operação ajusta o stock e não pode ser anulada pelo ecrã. Exporta primeiro um backup.'))return;const changes=[];for(const x of items){const diff=Math.round((x.qty-balance(x.productId,weekLoc))*1000)/1000;if(Math.abs(diff)>.000001)changes.push({id:uid(),type:'adjust',location:weekLoc,delta:diff,date:weekDate,productId:x.productId,unitCost:num(product(x.productId).cost),unitPrice:num(product(x.productId).price),notes:'Ajuste de contagem semanal '+weekDate,weeklyClose:true,weeklyCountId:count.id})}db.movements.push(...changes);db.weeklyCounts.push(count);delete db.weeklyDrafts[weekDraftKey()];persist();render();notify('Contagem semanal guardada')}catch(err){alert(err.message)}}
function settingsPage(){return heading('Definições & backup','Segurança dos dados e configuração da aplicação')+`<div class="notice">Esta aplicação inclui o catálogo de produtos e mínimos históricos. As quantidades reais de stock ainda não foram introduzidas. Funciona localmente no Chrome. Os dados NÃO são sincronizados automaticamente entre computador e iPhone. Exporta um backup após cada sessão de trabalho.</div><div class="two">${panel('Cópias de segurança',`<div class="panel-body"><h3>Exportar dados</h3><p class="muted">Guarda um ficheiro JSON com eventos, produtos, stocks, staff, compras, vendas e fechos.</p><button class="btn primary" onclick="exportData()">↓ Exportar backup completo</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Importar backup</h3><p class="muted">Substitui apenas os dados desta versão depois de uma confirmação.</p><input id="importFile" type="file" accept=".json,application/json" onchange="importData(this.files[0])"></div>`)}${panel('Informações',`<div class="panel-body stack"><div class="line"><span>Versão</span><strong>1.2 · Fecho semanal</strong></div><div class="line"><span>Armazenamento</span><strong>Chrome · local</strong></div><div class="line"><span>Eventos</span><strong>${db.events.length}</strong></div><div class="line"><span>Produtos</span><strong>${db.products.length}</strong></div><div class="line"><span>Movimentos</span><strong>${db.movements.length}</strong></div><div class="line"><span>Escalas</span><strong>${db.assignments.length}</strong></div></div>`)} </div>${panel('Fornecedores',table(['Fornecedor','Contacto',''],db.suppliers.map(s=>`<tr><td><strong>${e(s.name)}</strong></td><td>${e(s.contact||'—')}</td><td><button class="link" onclick="openSupplier('${s.id}')">Editar</button></td></tr>`).join('')),`<button class="btn sm" onclick="openSupplier()">＋ Adicionar</button>`)}<div class="notice blue">Esta é uma nova aplicação independente. Não lê, altera nem elimina o histórico de versões anteriores do LAV GESTÃO. Não apagues o ícone antigo do iPhone se ainda pretendes recuperar dados.</div>`}
function exportData(){const payload=JSON.stringify({app:'LAV Control',exportedAt:new Date().toISOString(),data:db},null,2),blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LAV_CONTROL_BACKUP_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Backup exportado')}async function importData(file){if(!file)return;try{const raw=JSON.parse(await file.text()),data=raw.data||raw;if(!Array.isArray(data.events)||!Array.isArray(data.products)||!Array.isArray(data.movements)||!Array.isArray(data.staff))throw Error('Ficheiro incompatível');if(!confirm('ATENÇÃO: a importação substitui os dados atuais desta versão. Exporta primeiro um backup. Continuar?'))return;db={...blank(),...data};persist();render();notify('Backup restaurado')}catch(err){alert('Não foi possível importar: '+err.message)}finally{$('importFile').value=''}}
render();if(page==='products'){refreshProducts();drawBarRestockRows();}const oldRender=render;render=function(){oldRender();if(page==='products')refreshProducts();if((page==='products'||(page==='movements'&&movTab==='transfer')))drawBarRestockRows();if(page==='weekly')weekDrawRows()};
</script></body></html>
